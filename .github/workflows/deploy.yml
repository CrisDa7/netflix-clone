
# ==========================================
# NETFLIX CLONE - GITHUB PAGES
# ==========================================
#
# Compila y publica la aplicación React
# utilizando GitHub Actions.
#
# El despliegue se ejecuta al publicar
# cambios en la rama main.

name: Deploy Netflix Clone

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build React Application
    runs-on: ubuntu-latest

    steps:
      # Descarga el código del repositorio.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configura Node.js y habilita caché de npm.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Instala las dependencias del proyecto.
      - name: Install dependencies
        run: npm ci

      # Comprueba la calidad del código.
      - name: Run ESLint
        run: npm run lint

      # Genera la versión de producción.
      - name: Build application
        run: npm run build
        env:
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}

      # Prepara GitHub Pages.
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # Sube los archivos generados.
      - name: Upload production files
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Publica la aplicación.
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
